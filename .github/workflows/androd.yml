name: Build Wholesale Invoice APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"

      - name: Build APK
        run: |
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WholesaleInvoice-APK
          path: app/build/outputs/apk/debug/app-debug.apk
